name: Deploy to Azure

# The Azure deployment has been taken down; run manually if it is re-provisioned.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/trading-signal:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/trading-signal:${{ github.sha }}
          build-args: |
            AZURE_STORAGE_ACCOUNT=${{ secrets.AZURE_STORAGE_ACCOUNT }}
            AZURE_STORAGE_KEY=${{ secrets.AZURE_STORAGE_KEY }}

      - name: Upload MLflow artifacts to Azure Blob
        run: |
          az storage container create \
            --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
            --account-key ${{ secrets.AZURE_STORAGE_KEY }} \
            --name mlruns || true
          az storage blob upload-batch \
            --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
            --account-key ${{ secrets.AZURE_STORAGE_KEY }} \
            --destination mlruns \
            --source ./mlruns \
            --overwrite true \
            || echo "No mlruns/ to upload, skipping"

      - name: Upload MLflow DB to Azure Blob
        run: |
          if [ -f ./mlflow.db ]; then
            az storage container create \
              --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
              --account-key ${{ secrets.AZURE_STORAGE_KEY }} \
              --name mlflow || true
            az storage blob upload \
              --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
              --account-key ${{ secrets.AZURE_STORAGE_KEY }} \
              --container-name mlflow \
              --file ./mlflow.db \
              --name mlflow.db \
              --overwrite true
          else
            echo "No mlflow.db found, skipping"
          fi

      - name: Deploy to Azure Container Apps — API
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name trading-signal-api \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --image ${{ secrets.ACR_LOGIN_SERVER }}/trading-signal:${{ github.sha }} \
              --set-env-vars \
                SERVICE=api \
                KAGGLE_USERNAME=${{ secrets.KAGGLE_USERNAME }} \
                KAGGLE_API_TOKEN=${{ secrets.KAGGLE_API_TOKEN }} \
                FRED_API_KEY=${{ secrets.FRED_API_KEY }} \
                MLFLOW_TRACKING_URI="sqlite:///mlflow.db" \
                MLFLOW_ARTIFACT_ROOT=${{ secrets.MLFLOW_ARTIFACT_ROOT }} \
                AZURE_STORAGE_ACCOUNT=${{ secrets.AZURE_STORAGE_ACCOUNT }}

      - name: Deploy to Azure Container Apps — Streamlit
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name trading-signal-streamlit \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --image ${{ secrets.ACR_LOGIN_SERVER }}/trading-signal:${{ github.sha }} \
              --set-env-vars \
                SERVICE=streamlit \
                API_URL=${{ secrets.API_URL }} \
                KAGGLE_USERNAME=${{ secrets.KAGGLE_USERNAME }} \
                KAGGLE_API_TOKEN=${{ secrets.KAGGLE_API_TOKEN }} \
                FRED_API_KEY=${{ secrets.FRED_API_KEY }} \
                MLFLOW_TRACKING_URI="sqlite:///mlflow.db" \
                MLFLOW_ARTIFACT_ROOT=${{ secrets.MLFLOW_ARTIFACT_ROOT }} \
                AZURE_STORAGE_ACCOUNT=${{ secrets.AZURE_STORAGE_ACCOUNT }}

      - name: Deploy to Azure Container Apps — Scheduler
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name trading-signal-scheduler \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --image ${{ secrets.ACR_LOGIN_SERVER }}/trading-signal:${{ github.sha }} \
              --set-env-vars \
                SERVICE=scheduler \
                KAGGLE_USERNAME=${{ secrets.KAGGLE_USERNAME }} \
                KAGGLE_API_TOKEN=${{ secrets.KAGGLE_API_TOKEN }} \
                FRED_API_KEY=${{ secrets.FRED_API_KEY }}