services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: uvicorn src.serving.api:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./predictions:/app/predictions
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_URL=http://api:8000
    volumes:
      - ./predictions:/app/predictions
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # daily prediction scheduler
  # runs make predict at 1 AM EET (22:00 UTC)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: /app/scheduler/entrypoint.sh
    env_file:
      - .env
    volumes:
      - ./predictions:/app/predictions
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    depends_on:
      - api
    restart: unless-stopped